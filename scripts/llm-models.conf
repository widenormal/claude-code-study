# llm-models.conf — 全 LLM ラッパーのモデル既定値（単一の正データ）
#
# 運用（詳細 = docs/llm-auto-update.md）:
#   - この値は「LLM 自己申請 → 機械審査 → PR → 人間裁定」の申請制で更新される
#     （.github/workflows/llm-model-update.yml が週次で申請を収集・審査する）
#   - 緊急時は手編集も可。ただし必ず PR 経由（main 直 push 禁止）
#   - 各ラッパーは ENV 上書き > この conf > 内蔵フォールバック の優先順で解決する
#   - 形式は厳密に KEY=value（クォート・空白・変数展開なし）。審査スクリプトが機械編集する
#
# verified: 2026-07-14（gpt-5.6-terra / gpt-5.6-sol は op 経由の実呼び出しで 200 確認済み）

# OpenAI — 参謀（戦略判断・敵対的レビュー・実装レビュー）
CODEX_DEFAULT_MODEL=gpt-5.6-terra
CODEX_FRONTIER_MODEL=gpt-5.6-sol

# xAI — 目（X/Twitter リアルタイム検索）
# データ取得は x-search.sh（X API 直・クレジット不要）が第一選択。
# grok-call.sh は xAI 直が失敗すると GROK_OPENROUTER_MODEL に自動フォールバック
GROK_DEFAULT_MODEL=grok-4-1-fast
GROK_OPENROUTER_MODEL=x-ai/grok-4.5

# xAI via Hermes CLI
HERMES_DEFAULT_MODEL=grok-4.3

# Google — 別視点（マルチモーダル・Google 検索グラウンディング）
GEMINI_DEFAULT_MODEL=gemini-2.5-flash
GEMINI_PRO_MODEL=gemini-2.5-pro

# ローカル — 手足（要約・分類・整形・スライド vision 検査。$0）
# qwen-slide = rutzbo 実在のカスタムモデル（qwen3_5_moe 35.1B / vision / 262K ctx /
# スライド検査用 System プロンプト焼き込み）。旧値 qwen3.5:7b-instruct は未インストールで 404
# QWEN_FAST_MODEL = MLX 高速・vision なし。バルク要約・分類用
QWEN_DEFAULT_MODEL=qwen-slide
QWEN_FAST_MODEL=qwen3.6:35b-mlx

# OpenRouter — 検索の目（出典付き調査。:online は呼び出し側で付与）
OPENROUTER_DEFAULT_MODEL=google/gemini-2.5-flash
