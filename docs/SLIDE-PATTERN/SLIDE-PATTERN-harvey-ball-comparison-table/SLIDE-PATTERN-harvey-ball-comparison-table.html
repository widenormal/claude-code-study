<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIDE-PATTERN-harvey-ball-comparison-table</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #E8E8E8;
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .slide-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }
    .slide {
      width: 960px;
      height: 540px;
      background: #FFFFFF;
      border: 1px solid #CCCCCC;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* タイトルエリア */
    .title-area {
      padding: 14px 40px 12px;
      border-bottom: 1px dashed #CCCCCC;
      flex-shrink: 0;
      background: #FAFAFA;
    }
    .area-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .title-placeholder {
      font-size: 16px;
      color: #CCCCCC;
      margin-top: 4px;
    }
    /* コンテンツエリア */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 48px;
      gap: 10px;
      overflow: hidden;
    }
    /* 比較表 */
    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      flex: 1;
    }
    .comparison-table th,
    .comparison-table td {
      border: 1px solid #CCCCCC;
      text-align: center;
      vertical-align: middle;
      padding: 8px 10px;
    }
    .comparison-table th {
      background: #F0F0F0;
      font-size: 13px;
      color: #333333;
      height: 44px;
    }
    .comparison-table th.criteria-head {
      width: 22%;
      background: #F0F0F0;
    }
    /* 推奨列の強調 */
    .comparison-table th.recommended {
      background: #333333;
      color: #FFFFFF;
      position: relative;
    }
    .recommended-tag {
      display: block;
      font-size: 9px;
      font-weight: normal;
      color: #CCCCCC;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }
    .comparison-table td.recommended-cell {
      background: #F5F5F5;
    }
    .comparison-table td.criteria-cell {
      text-align: left;
      font-size: 13px;
      color: #333333;
      background: #FAFAFA;
    }
    .criteria-sub {
      display: block;
      font-size: 10px;
      color: #999999;
      margin-top: 2px;
    }
    .comparison-table td {
      font-size: 12px;
      color: #555555;
    }
    .ball-cell svg {
      display: block;
      margin: 0 auto;
    }
    /* 凡例 */
    .legend-row {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }
    .legend-caption {
      font-size: 11px;
      color: #999;
      letter-spacing: 0.05em;
    }
    .legend-ball {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .legend-ball span {
      font-size: 10px;
      color: #666666;
    }
  </style>
</head>
<body>
  <p class="slide-label">[harvey-ball-comparison-table]</p>
  <div class="slide">

    <!-- タイトルエリア -->
    <div class="title-area">
      <div class="area-label">Title Area — SLIDE.md 参照</div>
      <div class="title-placeholder">スライドタイトルが入ります</div>
    </div>

    <!-- コンテンツエリア -->
    <div class="content-area">

      <table class="comparison-table">
        <thead>
          <tr>
            <th class="criteria-head">評価基準</th>
            <th class="recommended"><span class="recommended-tag">推奨</span>ベンダーA</th>
            <th>ベンダーB</th>
            <th>ベンダーC</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="criteria-cell">機能適合度<span class="criteria-sub">要件カバー率</span></td>
            <td class="ball-cell recommended-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><circle cx="12" cy="12" r="9" fill="#555555"/></svg>
            </td>
            <td class="ball-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><path d="M12,12 L12,3 A9,9 0 1,1 3,12 Z" fill="#555555"/></svg>
            </td>
            <td class="ball-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><path d="M12,12 L12,3 A9,9 0 0,1 12,21 Z" fill="#555555"/></svg>
            </td>
          </tr>
          <tr>
            <td class="criteria-cell">導入コスト<span class="criteria-sub">初期＋5年運用</span></td>
            <td class="ball-cell recommended-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><path d="M12,12 L12,3 A9,9 0 1,1 3,12 Z" fill="#555555"/></svg>
            </td>
            <td class="ball-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><circle cx="12" cy="12" r="9" fill="#555555"/></svg>
            </td>
            <td class="ball-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><path d="M12,12 L12,3 A9,9 0 0,1 21,12 Z" fill="#555555"/></svg>
            </td>
          </tr>
          <tr>
            <td class="criteria-cell">導入スピード<span class="criteria-sub">契約〜運用開始まで</span></td>
            <td class="ball-cell recommended-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><path d="M12,12 L12,3 A9,9 0 1,1 3,12 Z" fill="#555555"/></svg>
            </td>
            <td class="ball-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><path d="M12,12 L12,3 A9,9 0 0,1 12,21 Z" fill="#555555"/></svg>
            </td>
            <td class="ball-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><circle cx="12" cy="12" r="9" fill="#555555"/></svg>
            </td>
          </tr>
          <tr>
            <td class="criteria-cell">サポート体制<span class="criteria-sub">国内・日本語対応</span></td>
            <td class="ball-cell recommended-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><circle cx="12" cy="12" r="9" fill="#555555"/></svg>
            </td>
            <td class="ball-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><path d="M12,12 L12,3 A9,9 0 0,1 21,12 Z" fill="#555555"/></svg>
            </td>
            <td class="ball-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><path d="M12,12 L12,3 A9,9 0 0,1 12,21 Z" fill="#555555"/></svg>
            </td>
          </tr>
          <tr>
            <td class="criteria-cell">拡張性<span class="criteria-sub">外部ツールとの接続</span></td>
            <td class="ball-cell recommended-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><path d="M12,12 L12,3 A9,9 0 0,1 12,21 Z" fill="#555555"/></svg>
            </td>
            <td class="ball-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><path d="M12,12 L12,3 A9,9 0 1,1 3,12 Z" fill="#555555"/></svg>
            </td>
            <td class="ball-cell">
              <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><path d="M12,12 L12,3 A9,9 0 0,1 21,12 Z" fill="#555555"/></svg>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- 凡例 -->
      <div class="legend-row">
        <span class="legend-caption">充足度:</span>
        <div class="legend-ball">
          <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/></svg>
          <span>0%</span>
        </div>
        <div class="legend-ball">
          <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><path d="M12,12 L12,3 A9,9 0 0,1 21,12 Z" fill="#555555"/></svg>
          <span>25%</span>
        </div>
        <div class="legend-ball">
          <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><path d="M12,12 L12,3 A9,9 0 0,1 12,21 Z" fill="#555555"/></svg>
          <span>50%</span>
        </div>
        <div class="legend-ball">
          <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><path d="M12,12 L12,3 A9,9 0 1,1 3,12 Z" fill="#555555"/></svg>
          <span>75%</span>
        </div>
        <div class="legend-ball">
          <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><circle cx="12" cy="12" r="9" fill="#555555"/></svg>
          <span>100%</span>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
